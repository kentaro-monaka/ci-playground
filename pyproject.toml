[project]
name = "ci-playground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "paho-mqtt>=2.1.0",
    "psycopg[binary]>=3.3.4",
    "pymodbus>=3.14.0",
    "redis>=8.0.0",
    "sqlalchemy>=2.0.50",
]

[dependency-groups]
dev = [
    "fakeredis>=2.36.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "docker: 実Dockerコンテナ(Postgres等)が必要なテスト",
]

[tool.coverage.run]
source = ["src/ci_playground"]
branch = true     # if/else の両方を通ったか測定

[tool.coverage.report]
show_missing = true      # 通ってない行番号を表示
skip_covered = false      # 100%のファイルも表示
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D"]
ignore = ["D105", "D107"]   # 特殊メソッド と __init__ の docstring は不要
# E/W = pycodestyle (PEP 8)
# F   = pyflakes
# I   = isort（import 順）
# D   = pydocstyle（docstring チェック）

[tool.ruff.lint.pydocstyle]
convention = "google"   # Google スタイル docstring

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]              # テストはdocstring不要
"**/__init__.py" = ["D104"]     # 空の __init__.py は docstring 不要
"src/ci_playground/__init__.py" = ["D104"]
