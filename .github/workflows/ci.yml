name: CI
on: push
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps: 
      - name: checkout
        uses: actions/checkout@v4
      
      - name: setup-uv
        uses: astral-sh/setup-uv@v6
      
      - name: install dependencies
        run: uv sync --frozen --all-groups

      - name: lint
        run: uv run ruff check .

      - name: format-check
        run: uv run ruff format --check .
      
      - name: install socat (仮想シリアル)
        run: sudo apt-get update && sudo apt-get install -y socat
      
      - name: setup vcan (仮想CANバス)
        run: |
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
          ip -details link show vcan0
          
      - name: start postgres (compose)
        run: docker compose -f ops/docker-compose.yml up -d --wait
      
      - name: test with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90