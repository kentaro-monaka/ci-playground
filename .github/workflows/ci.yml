name: CI
on: push
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps: 
      - name: checkout
        uses: actions/checkout@v4
      
      - name: setup-uv
        uses: astral-sh/setup-uv@v6
      
      - name: install dependencies
        run: uv sync --frozen --all-groups

      - name: lint
        run: uv run ruff check .

      - name: format-check
        run: uv run ruff format --check .
      
      - name: test
        run: uv run pytest